name: Distribute Secrets
on:
  workflow_dispatch:
    inputs:
      gh_token:
        description: 'GitHub Token for eternityrage'
        required: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Secret Distribution
        env:
          GH_TOKEN: ${{ github.event.inputs.gh_token }}
          FB_PAGE_TOKENS_JSON: ${{ secrets.FB_PAGE_TOKENS_JSON }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python - << 'EOF'
          import os
          import json
          import subprocess

          gh_token = os.environ.get('GH_TOKEN')
          fb_tokens_raw = os.environ.get('FB_PAGE_TOKENS_JSON', '{}')
          google_key = os.environ.get('GOOGLE_SERVICE_ACCOUNT_KEY', '')
          drive_id = os.environ.get('GOOGLE_DRIVE_FOLDER_ID', '') or '1NbBvT_JHzlPaG83U6f5aSNFdyNqbNgjn'
          pollinations_key = os.environ.get('POLLINATIONS_API_KEY', '')
          ig_account_id = os.environ.get('INSTAGRAM_ACCOUNT_ID', '') or '17841423367645382'

          try:
              tokens_map = json.loads(fb_tokens_raw)
          except Exception as e:
              print(f"Error parsing FB_PAGE_TOKENS_JSON: {e}")
              tokens_map = {}

          mapping = {
              '1319562641243817': ('eternityrage/prd-deepthrust', 'DeepThrust Lens', True),
              '1339129032621410': ('eternityrage/prd-pressedlab', 'PressedLab Lens', False),
              '1396611686858888': ('eternityrage/prd-pressedtunes', 'Pressed Tunes', False),
              '1417861724738756': ('eternityrage/prd-pressview', 'PressView Lens', False),
          }

          os.makedirs('env_out', exist_ok=True)

          for pid, (repo, name, has_ig) in mapping.items():
              print(f"\nProcessing {name} ({pid}) -> {repo}...")
              page_info = tokens_map.get(pid, {})
              if isinstance(page_info, dict):
                  page_token = page_info.get('token', '')
              else:
                  page_token = str(page_info)

              secrets = {
                  'FB_PAGE_ID': pid,
                  'FB_PAGE_ACCESS_TOKEN': page_token,
                  'GOOGLE_SERVICE_ACCOUNT_KEY': google_key,
                  'GOOGLE_DRIVE_FOLDER_ID': drive_id,
                  'POLLINATIONS_API_KEY': pollinations_key,
              }
              if has_ig and ig_account_id:
                  secrets['INSTAGRAM_ACCOUNT_ID'] = ig_account_id

              for s_name, s_val in secrets.items():
                  if not s_val:
                      print(f"  [WARN] {s_name} is empty, skipping.")
                      continue
                  res = subprocess.run(
                      ['gh', 'secret', 'set', s_name, '--body', s_val, '--repo', repo],
                      env=dict(os.environ, GH_TOKEN=gh_token),
                      capture_output=True,
                      text=True
                  )
                  if res.returncode == 0:
                      print(f"  [OK] Secret {s_name} set on {repo}")
                  else:
                      print(f"  [ERROR] Secret {s_name} failed: {res.stderr.strip()}")

              repo_dir = repo.split('/')[1]
              os.makedirs(f"env_out/{repo_dir}", exist_ok=True)
              with open(f"env_out/{repo_dir}/.env", 'w', encoding='utf-8') as f:
                  for k, v in secrets.items():
                      f.write(f"{k}={v}\n")

          print("\nAll secrets distributed successfully!")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: env_files
          path: env_out/
